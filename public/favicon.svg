<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 34 112 112"
     fill="none" stroke-linecap="round" stroke-linejoin="round" role="img"
     aria-label="Ateliê Paranhos">
  <!-- Muda de endereço? Ver docs/MANUTENCAO.md (seção "Trocar o favicon").

       Duas coisas foram ajustadas em relação ao desenho original, e as duas são
       para render em tamanho de favicon, não mudança de arte:

       1. viewBox. O original era "0 0 110 150", mas o desenho ocupa só
          x 14..96 e y 40..140 — sobravam 40 unidades vazias no topo. Com
          preserveAspectRatio, isso encolhia o vaso a ~17px de 32. O recorte
          atual é a caixa quadrada de 112 centrada no desenho (centro 55, 90).

       2. stroke-width 3 em vez de 1.4. A 16px (tamanho na aba do navegador)
          1.4 rende meio pixel e o ícone vira uma mancha cinza. 3 é o menor
          valor que fica nítido a 16px sem engrossar demais a 180px. -->
  <style>
    /* Em aba escura o traço tinta some. Vira papel. */
    @media (prefers-color-scheme: dark) {
      .tinta { stroke: #fdf5ef }
    }
  </style>

  <g class="tinta" stroke="#2e2521" stroke-width="3">
    <!-- caules -->
    <path d="M55 96 C50 82 44 70 34 62"/>
    <path d="M55 96 C60 84 66 74 76 68"/>
    <path d="M55 96 V70"/>
    <!-- folha central, vazada -->
    <path d="M55 70 C48 62 44 52 45 42 C56 48 58 60 55 70 Z"/>
    <!-- vaso -->
    <path d="M40 100 H70 L64 132 C63 137 60 140 55 140 C50 140 47 137 46 132 Z"/>
    <path d="M37 100 H73"/>
  </g>

  <!-- folhas laterais, em ouro -->
  <g stroke="#8a6f4a" stroke-width="3" fill="#8a6f4a" fill-opacity="0.12">
    <path d="M34 62 C22 58 16 50 14 40 C27 41 35 50 40 62 Z"/>
    <path d="M76 68 C88 62 94 54 96 44 C83 45 74 54 70 66 Z"/>
  </g>
</svg>
